name: Release
# Builds every extension, packs it, and publishes a GitHub release with the
# .pteroext files, SHA256SUMS.txt and generated notes.
#   - Push a tag like v1.2.0, or
#   - run this workflow from the Actions tab and type the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v1.2.0
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.0"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: repo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pterodactyl/panel
          ref: 2.0-develop
          path: panel
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer
      - name: Prepare panel SDK
        working-directory: panel
        run: npm ci && npm run sdk:generate && npm run sdk:testing
      - name: Build and test every extension
        run: |
          mkdir -p panel/extensions-src
          cp -r repo/extensions/* panel/extensions-src/
          for dir in panel/extensions-src/*/; do
            echo "::group::$(basename "$dir")"
            (cd "$dir" && npm install --legacy-peer-deps --no-audit --no-fund && npx tsc && npm test && npm run build)
            echo "::endgroup::"
          done
      - name: PHP tests
        working-directory: repo
        run: |
          composer install --no-interaction --no-progress
          for dir in extensions/*/; do
            if [ -f "$dir/phpunit.xml" ]; then
              (cd "$dir" && ../../vendor/bin/phpunit)
            fi
          done
      - name: Pack and checksum
        run: php repo/scripts/build-release.php panel/extensions-src out "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: out
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: out
      - name: Publish release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" *.pteroext SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes-file release-notes.md
