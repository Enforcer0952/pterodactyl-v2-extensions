name: CI
on:
  push:
  pull_request:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.list.outputs.extensions }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "extensions=$(ls extensions | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  extension:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJson(needs.list.outputs.extensions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: pterodactyl/panel
          ref: 2.0-develop
          path: panel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - name: Prepare panel SDK
        working-directory: panel
        run: npm ci && npm run sdk:generate && npm run sdk:testing
      - name: Install
        run: |
          mkdir -p panel/extensions-src
          cp -r repo/extensions/${{ matrix.extension }} panel/extensions-src/
          cd panel/extensions-src/${{ matrix.extension }}
          npm install --legacy-peer-deps
      - name: Typecheck, test, build
        working-directory: panel/extensions-src/${{ matrix.extension }}
        run: npx tsc && npm test && npm run build
      - name: PHP syntax
        working-directory: repo/extensions/${{ matrix.extension }}
        run: find src routes database -name '*.php' -print0 2>/dev/null | xargs -0 -n1 php -l
      - name: PHP tests
        working-directory: repo
        run: |
          composer install --no-interaction --no-progress
          if [ -f extensions/${{ matrix.extension }}/phpunit.xml ]; then
            cd extensions/${{ matrix.extension }} && ../../vendor/bin/phpunit
          fi
